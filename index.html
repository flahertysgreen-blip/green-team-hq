if(page==='jobs'){let visible=jobs.filter(j=>isOwner||(j.status==='Available'||j.assigned===role()));if(filter)visible=visible.filter(j=>[j.title,j.customer,j.address,j.date,j.status].join(' ').toLowerCase().includes(filter.toLowerCase()));out=`<div class="row"><h2>${isOwner?'Jobs & photo review':'Available & accepted jobs'}</h2><span class="muted">${visible.length} jobs</span></div><div class="toolbar"><input placeholder="Search customer, address, service..." value="${esc(filter)}" oninput="filter=this.value;render()"></div><div class="panel scroll"><table><thead><tr><th>Service</th><th>Customer</th><th>Address</th><th>Scheduled</th><th>Status</th><th></th></tr></thead><tbody>${visible.map(j=>`<tr><td>${esc(j.title)} ${j.overdue?'<span class="pill warning">Overdue in export</span>':''}</td><td>${esc(j.customer)}</td><td>${esc(j.address)}</td><td>${esc(j.date)}</td><td><span class="pill">${esc(j.status)}</span></td><td><button onclick="openJob(${j.id})">Open</button></td></tr>`).join('')}</tbody></table></div>`}

if(page==='subscriptions'){out=`<h2>Recurring billing reference</h2><div class="cards"><div class="card"><span class="muted">Active</span><strong>${activeSubs.length}</strong></div><div class="card"><span class="muted">Monthly scheduled total</span><strong>${money(monthly)}</strong></div></div><div class="panel scroll"><table><tr><th>Customer</th><th>Service</th><th>Billing day</th><th>Amount</th><th>Status</th></tr>${subs.map(s=>`<tr><td>${esc(s.customer)}</td><td>${esc(s.name)}</td><td>${esc(s.billing)}</td><td>${money(s.amount)}</td><td>${s.active?'Active':'Inactive'}</td></tr>`).join('')}</table></div><p class="muted">Reference data only; no recurring payments are created or modified.</p>`}
if(page==='profit'){const completed=jobs.filter(j=>j.status==='Completed');out=`<h2>Job profitability</h2><p class="muted">For accurate profits, enter actual job revenue and subcontractor/material/allocated costs. Subscription revenue must be allocated across visits.</p><div class="panel scroll"><table><tr><th>Customer</th><th>Job</th><th>Duration</th><th>Revenue entered</th><th>Costs entered</th><th>Estimated margin</th></tr>${completed.map(j=>{let cost=Number(j.cost||0)+Number(j.material||0)+Number(j.overhead||0);let dur=j.start&&j.finish?Math.max(0,Math.round((new Date(j.finish)-new Date(j.start))/60000))+' min':'—';return `<tr><td>${esc(j.customer)}</td><td>${esc(j.title)}</td><td>${dur}</td><td>${money(j.revenue||0)}</td><td>${money(cost)}</td><td>${j.revenue!==undefined?money(j.revenue-cost):'Not calculated'}</td></tr>`}).join('')}</table>${completed.length?'':'<div class="empty">Completed jobs will appear here.</div>'}</div>`}

function openJob(id){selected=id;draw()};function update(id,key,value){let j=jobs.find(x=>x.id===id);j[key]=value;save();draw()};function startJob(id){let j=jobs.find(x=>x.id===id);j.start=new Date().toISOString();j.status='In progress';save();draw()};function finishJob(id){let j=jobs.find(x=>x.id===id);if(!j.before.length||!j.after.length){alert('Before and after photos are required.');return}j.finish=new Date().toISOString();j.status='Completed';j.review='Pending';save();draw()};function claim(id){let j=jobs.find(x=>x.id===id);if(j.status!=='Available')return;j.assigned=role();j.status='Claimed';save();render();openJob(id)};function approve(id,approval){let j=jobs.find(x=>x.id===id);j.review=approval;save();draw()};function photoUpload(id,type,input){let j=jobs.find(x=>x.id===id);const files=[...input.files].slice(0,5);for(const file of files){if(file.size>1500000){alert('Preview limit: each photo must be under 1.5 MB. Hosted version will support full-size photos.');continue}const reader=new FileReader();reader.onload=()=>{j[type].push({at:new Date().toISOString(),data:reader.result});save();draw()};reader.readAsDataURL(file)}};
function draw(){let root=document.getElementById('drawer');if(selected===null){root.innerHTML='';return}let j=jobs.find(x=>x.id===selected);if(!j){root.innerHTML='';return}const isOwner=owner();let canEdit=isOwner||j.assigned===role();let photos=t=>`<div><b>${t==='before'?'Before':'After'} (${j[t].length})</b>${j[t].map(p=>`<div><img src="${p.data}" alt="${t} job photo"><div class="muted">${esc(new Date(p.at).toLocaleString())}</div></div>`).join('')}${canEdit?`<label>Upload ${t} photos<input type="file" accept="image/*" capture="environment" multiple onchange="photoUpload(${j.id},'${t}',this)"></label>`:''}</div>`;root.innerHTML=`<aside class="detail"><div class="row"><h2>${esc(j.title)}</h2><button onclick="selected=null;draw()">✕ Close</button></div><div class="muted">${esc(j.customer)} · ${esc(j.address)}<br>${esc(j.date)}</div><div class="note">Status: <b>${esc(j.status)}</b> · Review: ${esc(j.review)}</div>${isOwner?`<label>Offer / assign to subcontractor</label><select onchange="update(${j.id},'assigned',this.value)"><option value="">Shared available list</option>${workers.map(w=>`<option ${j.assigned===w?'selected':''}>${w}</option>`).join('')}</select><label>Scheduled date</label><input type="date" value="${dateKey(j.date)}" onchange="update(${j.id},'date',this.value);render()"><label>Job status</label><select onchange="update(${j.id},'status',this.value)">${['Available','Offered','Claimed','In progress','Completed'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select>`:j.status==='Available'?`<button class="primary" onclick="claim(${j.id})">Claim this job</button>`:''}${canEdit?`<div class="stack" style="margin:15px 0"><button onclick="startJob(${j.id})" ${j.start?'disabled':''}>Start job</button><button class="primary" onclick="finishJob(${j.id})" ${j.status==='Completed'?'disabled':''}>Finish job</button></div>`:''}<div class="note"><b>Time tracking</b><br>Started: ${j.start?new Date(j.start).toLocaleString():'Not started'}<br>Finished: ${j.finish?new Date(j.finish).toLocaleString():'Not finished'}${j.start&&j.finish?`<br>Duration: ${Math.max(0,Math.round((new Date(j.finish)-new Date(j.start))/60000))} minutes`:''}</div><div class="photo-grid">${photos('before')}${photos('after')}</div>${canEdit?`<label>Job notes</label><textarea rows="3" onblur="update(${j.id},'notes',this.value)">${esc(j.notes)}</textarea>`:j.notes?`<p>${esc(j.notes)}</p>`:''}${isOwner?`<hr><h3>Owner-only financial analysis</h3><p class="muted">Enter revenue attributable to this visit. For subscriptions, allocate monthly billing across visits.</p>${[['revenue','Job revenue'],['cost','Subcontractor cost'],['material','Materials'],['overhead','Fuel / overhead allocation']].map(([k,label])=>`<label>${label} ($)</label><input type="number" min="0" step="0.01" value="${Number(j[k]||0)}" onchange="update(${j.id},'${k}',Number(this.value))">`).join('')}<div class="note">Estimated profit: <b>${j.revenue!==undefined?money(Number(j.revenue||0)-Number(j.cost||0)-Number(j.material||0)-Number(j.overhead||0)):'Enter revenue to calculate'}</b></div>${j.status==='Completed'?`<div class="stack"><button class="primary" onclick="approve(${j.id},'Approved')">Approve photos</button><button onclick="approve(${j.id},'Corrections requested')">Request corrections</button></div>`:''}`:''}</aside>`}

const parseDay=s=>{if(!s)return null;if(s==='Today')return new Date(2026,10,20);if(/^\d{4}-\d{2}-\d{2}$/.test(s)){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}let m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?new Date(+m[3],+m[1]-1,+m[2]):null};
const localKey=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const dateKey=s=>localKey(parseDay(s));
let jobsOn=day=>jobs.filter(j=>dateKey(j.date)===day);
function moveMonth(delta){let [y,m]=calendarMonth.split('-').map(Number);calendarMonth=localKey(new Date(y,m-1+delta,1)).slice(0,7);render()}
function chooseDay(d){chosenDate=d;calendarView='day';render()}
function setView(v){calendarView=v;render()}
function calendarHTML(){let [year,month]=calendarMonth.split('-').map(Number);let first=new Date(year,month-1,1),count=new Date(year,month,0).getDate(),start=first.getDay();let relevant=jobs.filter(j=>dateKey(j.date).startsWith(calendarMonth));let total=relevant.length,completed=relevant.filter(j=>j.status==='Completed').length;
let controls=`<div class="row"><h2>Job calendar</h2><button class="primary" onclick="changePage('create')">+ Create Job</button></div><div class="toolbar"><button onclick="moveMonth(-1)">‹ Previous</button><b>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button onclick="moveMonth(1)">Next ›</button><button onclick="calendarMonth='2026-11';chosenDate='2026-11-20';render()">November 2026</button><span style="flex:1"></span>${['month','week','day'].map(v=>`<button class="${calendarView===v?'active':''}" onclick="setView('${v}')">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div><div class="cards"><div class="card"><span class="muted">Jobs this month</span><strong>${total}</strong></div><div class="card"><span class="muted">Completed</span><strong>${completed}</strong></div><div class="card"><span class="muted">Available / offered</span><strong>${relevant.filter(j=>['Available','Offered'].includes(j.status)).length}</strong></div><div class="card"><span class="muted">Scheduled on selected day</span><strong>${jobsOn(chosenDate).length}</strong></div></div>`;
let cells='';if(calendarView==='month'){for(let i=0;i<start;i++)cells+='<div class="cal-empty"></div>';for(let d=1;d<=count;d++){let key=localKey(new Date(year,month-1,d)),arr=jobsOn(key);cells+=`<button class="cal-day ${chosenDate===key?'selected-day':''}" onclick="chooseDay('${key}')"><b>${d}</b><span class="cal-count">${arr.length} ${arr.length===1?'job':'jobs'}</span>${arr.slice(0,3).map(j=>`<span class="cal-event">${esc(j.customer)} · ${esc(j.title)}</span>`).join('')}${arr.length>3?`<small>+${arr.length-3} more</small>`:''}</button>`}return controls+`<div class="cal-grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="cal-head">${d}</div>`).join('')}${cells}</div><p class="muted">Select a day to see its jobs. Imported dates are shown as provided; they are not automatically rescheduled.</p>`}
let day=new Date(chosenDate+'T12:00:00'),days=[];if(calendarView==='week'){let sun=new Date(day);sun.setDate(day.getDate()-day.getDay());for(let i=0;i<7;i++){let d=new Date(sun);d.setDate(sun.getDate()+i);days.push(localKey(d))}}else days=[chosenDate];return controls+days.map(d=>`<div class="panel" style="margin:10px 0"><div class="row"><h3>${new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})} · ${jobsOn(d).length} jobs</h3><button onclick="chosenDate='${d}';changePage('create')">+ Job on this day</button></div>${jobsOn(d).length?jobsOn(d).map(j=>`<div class="cal-list" onclick="openJob(${j.id})"><b>${esc(j.title)}</b><span>${esc(j.customer)} · ${esc(j.address)}</span><small>${esc(j.status)}${j.assigned?' · '+esc(j.assigned):''}</small></div>`).join(''):'<p class="muted">No jobs scheduled.</p>'}</div>`).join('')}
function createHTML(){let options=customerNames.map(c=>`<option value="${esc(c)}">`).join('');return `<div class="row"><h2>Create & schedule a job</h2><button onclick="changePage('calendar')">Back to calendar</button></div><div class="panel" style="max-width:740px"><p class="muted">Create one-time work or a recurring service. Subcontractors can claim shared jobs or receive an individual offer.</p><form id="newjob" onsubmit="createJob(event)"><div class="form-grid"><label>Customer<input name="customer" list="customersList" required placeholder="Select or enter customer"></label><datalist id="customersList">${options}</datalist><label>Service / job title<input name="title" required placeholder="Lawn maintenance, cleanup..."></label><label>Customer phone number<input name="phone" type="tel" placeholder="(352) 555-1234"></label><label>Property address<input name="address" required placeholder="Street address"></label><label>First scheduled date<input name="date" type="date" value="${chosenDate}" required></label><label>Repeat<select name="repeat"><option value="none">One-time</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="monthly">Monthly</option></select></label><label>Generate visits for<select name="visits"><option value="1">First visit only</option><option value="4">4 visits</option><option value="8">8 visits</option><option value="12">12 visits</option></select></label><label>Offer to<select name="assigned"><option value="">Shared available jobs</option>${workers.map(w=>`<option>${w}</option>`).join('')}</select></label><label>Job revenue ($) · owner only<input name="revenue" type="number" min="0" step="0.01" placeholder="Optional"></label></div><label>Instructions / notes<textarea name="notes" rows="3" placeholder="Scope of work, gate access, special instructions"></textarea></label><p class="muted">Recurring visits are created as separate jobs. Payment subscriptions are not changed.</p><button class="primary" type="submit">Save & schedule job</button></form></div>`}
function createJob(e){e.preventDefault();let f=new FormData(e.target),repeat=f.get('repeat'),n=repeat==='none'?1:Number(f.get('visits')),base=new Date(f.get('date')+'T12:00:00'),id=Math.max(0,...jobs.map(j=>j.id))+1;for(let i=0;i<n;i++){let d=new Date(base);if(repeat==='weekly')d.setDate(d.getDate()+7*i);if(repeat==='biweekly')d.setDate(d.getDate()+14*i);if(repeat==='monthly')d.setMonth(d.getMonth()+i);let a=f.get('assigned');let j={id:id+i,title:f.get('title').trim(),customer:f.get('customer').trim(),address:f.get('address').trim(),date:localKey(d),amount:0,status:a?'Offered':'Available',overdue:false,assigned:a,start:'',finish:'',before:[],after:[],notes:f.get('notes'),review:'Pending'};if(f.get('revenue')!=='')j.revenue=Number(f.get('revenue'));jobs.push(j)}save();calendarMonth=f.get('date').slice(0,7);chosenDate=f.get('date');calendarView='day';page='calendar';render();alert(`${n} job${n===1?'':'s'} scheduled in this browser preview.`)}

function setEstimateStatus(id,status){let e=estimates.find(x=>x.id===id);if(!e)return;e.status=status;saveEstimates();render()}
function viewEstimate(id){let e=estimates.find(x=>x.id===id);if(!e)return;document.getElementById('drawer').innerHTML=`<aside class="detail"><div class="row"><h2>Estimate EST-${e.id}</h2><button onclick="selected=null;document.getElementById('drawer').innerHTML=''">✕ Close</button></div><p><b>${esc(e.customer)}</b><br>${esc(e.phone||'No phone entered')}<br>${esc(e.address)}</p><p class="muted">${esc(e.category)} · ${esc(e.status)}</p><h3>${esc(e.title)}</h3><div class="note" style="white-space:pre-wrap">${esc(e.scope)}</div><h2>${money(e.price)}</h2><p>Expires: ${esc(e.expires||'Not set')}</p><p class="muted">Customer-facing layout preview only. This is not a shareable acceptance link.</p>${e.status==='Sent'?`<button class="primary" onclick="acceptEstimate(${e.id})">Simulate acceptance</button>`:''}${e.jobId?`<p class="note">Job #${e.jobId} created and awaiting owner scheduling approval.</p>`:''}</aside>`}
function acceptEstimate(id){let e=estimates.find(x=>x.id===id);if(!e||e.status!=='Sent'||e.jobId)return;if(!confirm('SIMULATION ONLY: Pretend this customer accepted the estimate and create a job awaiting your scheduling approval?'))return;let j={id:Math.max(0,...jobs.map(x=>x.id))+1,title:e.title,customer:e.customer,address:e.address,date:'',amount:e.price,revenue:e.price,category:e.category,status:'Awaiting scheduling approval',overdue:false,assigned:'',start:'',finish:'',before:[],after:[],notes:e.scope,review:'Pending',estimateId:e.id,approvalRequired:true};jobs.push(j);e.status='Accepted';e.acceptedAt=new Date().toISOString();e.jobId=j.id;save();saveEstimates();selected=null;page='approvals';render()}
function approvalsHTML(){let pending=jobs.filter(j=>j.status==='Awaiting scheduling approval');return `<div class="row"><h2>Scheduling approvals</h2><span class="pill warning">${pending.length} awaiting review</span></div><p class="muted">Accepted estimates create jobs here, NOT on the calendar or subcontractor job list. Only you can approve and release them.</p>${pending.map(j=>`<div class="panel" style="margin:12px 0"><div class="row"><div><h3>${esc(j.title)}</h3><p>${esc(j.customer)} · ${esc(j.address)}</p><p class="muted">${esc(j.category||'Lawn & landscaping')} · Estimate EST-${j.estimateId||'—'}</p></div><b>${money(j.amount||0)}</b></div><div class="form-grid"><label>Scheduled date / service window start<input type="date" id="approveDate${j.id}"></label><label>Offer to<select id="approveWorker${j.id}"><option value="">All approved subcontractors</option>${workers.map(w=>`<option>${esc(w)}</option>`).join('')}</select></label></div><p class="muted">Approving releases this job to the selected subcontractor or shared pool. This preview does not send notifications.</p><button class="primary" onclick="releaseJob(${j.id})">Approve scheduling & release</button></div>`).join('')||'<div class="panel empty">No jobs awaiting scheduling approval.</div>'}`}
function releaseJob(id){let j=jobs.find(x=>x.id===id);if(!j||j.status!=='Awaiting scheduling approval')return;let d=document.getElementById('approveDate'+id).value,w=document.getElementById('approveWorker'+id).value;if(!d){alert('Choose a scheduled date first.');return}j.date=d;j.assigned=w;j.status=w?'Offered':'Available';j.approvalRequired=false;save();chosenDate=d;calendarMonth=d.slice(0,7);page='calendar';render();alert('Job approved and released in this local preview.')}
function specialtyHTML(){let arr=jobs.filter(j=>specialtyTypes.includes(j.category)||/junk|handyman|clean ?out|pressure wash|palm|tree/i.test(j.title));return `<div class="row"><h2>Specialty Services</h2><button class="primary" onclick="changePage('create')">+ Create specialty job</button></div><p class="muted">Junk removal, handyman, property cleanouts, pressure washing, tree & palm work, and other projects. These jobs also appear on the main calendar when scheduled.</p><div class="cards">${specialtyTypes.map(t=>`<div class="card"><span class="muted">${esc(t)}</span><strong>${arr.filter(j=>j.category===t||(!j.category&&j.title.toLowerCase().includes(t.toLowerCase().split(' ')[0]))).length}</strong></div>`).join('')}</div><div class="panel scroll"><table><tr><th>Job</th><th>Customer</th><th>Date</th><th>Status</th><th></th></tr>${arr.map(j=>`<tr><td>${esc(j.title)}</td><td>${esc(j.customer)}</td><td>${esc(j.date||'Unscheduled')}</td><td>${esc(j.status)}</td><td><button onclick="openJob(${j.id})">Open</button></td></tr>`).join('')}</table></div>`}
const v4Render=render;
render=function(){if(!owner()&&['estimates','estimate-create','approvals','specialty'].includes(page))page='jobs';v4Render();if(!owner())return;const nav=document.getElementById('nav');const tabs=[['estimates','Estimates'],['approvals','Scheduling approvals ('+jobs.filter(j=>j.status==='Awaiting scheduling approval').length+')'],['specialty','Specialty Services']];nav.innerHTML+=tabs.map(([k,v])=>`<button class="${page===k?'active':''}" onclick="changePage('${k}')">${v}</button>`).join('');if(page==='estimates')document.getElementById('app').innerHTML=estimateList();if(page==='estimate-create')document.getElementById('app').innerHTML=estimateForm();if(page==='approvals')document.getElementById('app').innerHTML=approvalsHTML();if(page==='specialty')document.getElementById('app').innerHTML=specialtyHTML();if(page==='create'){let cat=`<label>Service category<select name="category"><option>Lawn & landscaping</option>${specialtyTypes.map(t=>`<option>${t}</option>`).join('')}</select></label>`;document.querySelector('#newjob .form-grid').insertAdjacentHTML('afterbegin',cat)}};
const v4CreateJob=createJob;
createJob=function(event){let cat=event.target.querySelector('[name="category"]')?.value;let ids=new Set(jobs.map(j=>j.id));v4CreateJob(event);jobs.filter(j=>!ids.has(j.id)).forEach(j=>j.category=cat||'Lawn & landscaping');save()};
// Keep pending approval jobs out of the calendar until the owner releases them.
const v4JobsOn=jobsOn;
jobsOn=function(day){return v4JobsOn(day).filter(j=>j.status!=='Awaiting scheduling approval')};
const v4Export=exportData;
exportData=function(){const blob=new Blob([JSON.stringify({jobs,subscriptions:subs,estimates,exported:new Date().toISOString()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='green-team-hq-v5-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
render();
</script></body></html>
